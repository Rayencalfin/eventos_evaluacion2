{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center text-center my-5 py-4">
    <div class="col-md-8 col-lg-6">
        <i class="fa-solid fa-compass-drafting fa-5x text-muted mb-4"></i>
        <h1 class="display-4 fw-bold text-dark">404</h1>
