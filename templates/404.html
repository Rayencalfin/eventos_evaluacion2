{% extends 'base.html' %}
{% load static %}

{% block title %}Enlace no encontrado | 404{% endblock %}

{% block content %}
<div class="container py-5 text-center d-flex flex-column align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="card border-0 shadow-lg p-5 rounded-4" style="max-width: 550px; width: 100%;">
        <div class="display-1 fw-bold text-muted mb-2">404</div>
        <div class="mb-4">
            <i class="fa-solid fa-magnifying-glass fa-4x" style="color: #6f42c1;"></i>
        </div>
        
        <h2 class="fw-bold mb-3 text-dark">ENLACE NO ENCONTRADO</h2>
        
        <p class="text-muted mb-4 fs-6">
            La página que buscas no existe o la dirección ingresada no es válida.
        </p>

        <div>
            <a href="{% url 'eventos_web:index' %}" class="btn text-white fw-bold px-4 py-2 rounded-pill shadow-sm" style="background-color: #6f42c1;">
                <i class="fa-solid fa-house me-2"></i>Volver al inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
